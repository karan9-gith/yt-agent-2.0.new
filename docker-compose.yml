services:
  contentpilot-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contentpilot-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/backend/prisma/production.db
      - STORAGE_DIR=/app/backend/storage
    volumes:
      # Persistent SQLite database volume
      - contentpilot_data:/app/backend/prisma
      # Persistent media storage volume
      - contentpilot_storage:/app/backend/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  contentpilot_data:
    driver: local
  contentpilot_storage:
    driver: local
